appId: dev.isw.rivermindpoker
name: Slice 3.10 private reconnect without moment replay
---
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- tapOn:
    id: "home.allGames"
- scrollUntilVisible:
    element:
      id: "play.multiplayer.resume"
    direction: DOWN
- tapOn:
    id: "play.multiplayer.resume"
- extendedWaitUntil:
    id: "moment.launcher"
    timeout: 20000
- assertNotVisible: "Let’s go!"
- assertNotVisible: "Good game!"
- takeScreenshot: slice-3.10-private-reconnect-no-replay
