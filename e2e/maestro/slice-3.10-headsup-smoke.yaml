appId: dev.isw.rivermindpoker
name: Slice 3.10 heads-up orientation and action smoke
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Profile & settings"
    commands:
      - tapOn:
          id: "nav.back"
- runFlow:
    when:
      visible: "Portrait table"
    commands:
      - tapOn:
          id: "nav.back"
- waitForAnimationToEnd
- tapOn:
    id: "tab.play"
- scrollUntilVisible:
    element:
      id: "play.ai.format.practice"
    direction: DOWN
- tapOn:
    id: "play.ai.format.practice"
- scrollUntilVisible:
    element:
      id: "play.ai.players.2"
    direction: DOWN
- tapOn:
    id: "play.ai.players.2"
- scrollUntilVisible:
    element:
      id: "play.ai.start"
    direction: DOWN
- tapOn:
    id: "play.ai.start"
- assertVisible:
    id: "table.orientation.portrait"
- assertVisible:
    id: "table.orientation.landscape"
- tapOn:
    id: "table.orientation.landscape"
- tapOn:
    # XCUITest retains portrait hit-test coordinates for one snapshot after an
    # app-owned rotation. This is the landscape Call action at the stable
    # right-rail action row, expressed as a percentage of the rotated viewport.
    point: "12%,84%"
- takeScreenshot: slice-3.10-headsup-landscape
- tapOn:
    # Portrait selector in the stable landscape header control.
    point: "95%,86%"
- waitForAnimationToEnd
- takeScreenshot: slice-3.10-headsup-portrait
