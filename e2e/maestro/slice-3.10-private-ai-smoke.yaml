appId: dev.isw.rivermindpoker
name: Slice 3.10 private AI table orientation smoke
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "home.allGames"
- scrollUntilVisible:
    element:
      id: "play.multiplayer.create"
    direction: DOWN
- tapOn:
    id: "play.multiplayer.create"
- tapOn:
    id: "multiplayer.create.seats.${PLAYER_COUNT}"
- tapOn:
    id: "multiplayer.create.continue"
- extendedWaitUntil:
    id: "multiplayer.lobby.primary"
    timeout: 20000
- tapOn:
    id: "multiplayer.lobby.openSeat"
    index: 0
- tapOn:
    id: "multiplayer.lobby.primary"
- extendedWaitUntil:
    id: "multiplayer.lobby.primary"
    timeout: 20000
- tapOn:
    id: "multiplayer.lobby.primary"
- extendedWaitUntil:
    id: "table.orientation.portrait"
    timeout: 20000
- assertVisible:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-private-${PLAYER_COUNT}-seat-portrait
- tapOn:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-private-${PLAYER_COUNT}-seat-landscape
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- waitForAnimationToEnd
