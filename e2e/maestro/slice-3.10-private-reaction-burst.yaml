appId: dev.isw.rivermindpoker
name: Slice 3.10 private reaction burst
---
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- tapOn:
    id: "home.allGames"
- scrollUntilVisible:
    element:
      id: "play.multiplayer.resume"
    direction: DOWN
- tapOn:
    id: "play.multiplayer.resume"
- extendedWaitUntil:
    id: "moment.launcher"
    timeout: 20000
- tapOn:
    id: "moment.launcher"
- assertVisible: "Good game reaction"
- tapOn:
    id: "moment.reaction.cheer"
    repeat: 8
    delay: 40
- tapOn:
    id: "moment.reaction.laugh"
    repeat: 4
    delay: 40
- tapOn:
    id: "moment.reaction.goodGame"
    repeat: 4
    delay: 40
- assertVisible: "Good game reaction"
- takeScreenshot: slice-3.10-${SENDER}-reaction-burst
