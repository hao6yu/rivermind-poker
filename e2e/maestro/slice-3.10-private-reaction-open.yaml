appId: dev.isw.rivermindpoker
name: Slice 3.10 private reaction tray open
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "home.allGames"
    commands:
      - tapOn:
          id: "home.allGames"
      - scrollUntilVisible:
          element:
            id: "play.multiplayer.resume"
          direction: DOWN
      - tapOn:
          id: "play.multiplayer.resume"
- extendedWaitUntil:
    id: "moment.launcher"
    timeout: 20000
- tapOn:
    id: "moment.launcher"
- takeScreenshot: slice-3.10-private-reaction-tray
