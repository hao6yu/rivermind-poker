appId: dev.isw.rivermindpoker
name: Slice 3.10 Daily Challenge orientation smoke
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "home.dailyChallenge"
- assertVisible:
    id: "table.orientation.portrait"
- assertVisible:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-daily-portrait
- tapOn:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-daily-landscape
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- waitForAnimationToEnd
