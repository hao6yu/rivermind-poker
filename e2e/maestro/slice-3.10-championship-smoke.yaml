appId: dev.isw.rivermindpoker
name: Slice 3.10 Championship orientation smoke
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "home.allGames"
- scrollUntilVisible:
    element:
      id: "play.championship.entry"
    direction: DOWN
- tapOn:
    id: "play.championship.entry"
- scrollUntilVisible:
    element:
      id: "championship.event.local_3"
    direction: DOWN
- tapOn:
    id: "championship.event.local_3"
- assertVisible:
    id: "table.orientation.portrait"
- assertVisible:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-championship-portrait
- tapOn:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-championship-landscape
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- waitForAnimationToEnd
