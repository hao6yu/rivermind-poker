appId: dev.isw.rivermindpoker
name: Slice 3.10 local multiway orientation smoke
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Use a balanced plan for now"
    commands:
      - tapOn:
          text: "Use a balanced plan for now"
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Leave table"
    commands:
      - tapOn:
          text: "Leave table"
- waitForAnimationToEnd
- tapOn:
    text: "All games.*"
- tapOn:
    text: "${PLAYER_COUNT}"
- scrollUntilVisible:
    element:
      text: "Start a practice session with this configuration"
    direction: DOWN
- tapOn:
    text: "Start a practice session with this configuration"
- assertVisible:
    text: "Switch to landscape"
- takeScreenshot: slice-3.10-${PLAYER_COUNT}-seat-portrait
- tapOn:
    text: "Switch to landscape"
- waitForAnimationToEnd
- assertVisible:
    text: "Leave table"
- takeScreenshot: slice-3.10-${PLAYER_COUNT}-seat-landscape
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- waitForAnimationToEnd
