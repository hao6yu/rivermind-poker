appId: dev.isw.rivermindpoker
name: Slice 3.10 local multiway orientation smoke
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Use a balanced plan for now"
    commands:
      - tapOn:
          id: "guided.setup.skip"
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Leave table"
    commands:
      - tapOn:
          id: "table.leave"
- waitForAnimationToEnd
- tapOn:
    id: "home.allGames"
- tapOn:
    id: "play.ai.players.${PLAYER_COUNT}"
- scrollUntilVisible:
    element:
      id: "play.ai.start"
    direction: DOWN
- tapOn:
    id: "play.ai.start"
- assertVisible:
    text: "Switch to landscape"
- takeScreenshot: slice-3.10-${PLAYER_COUNT}-seat-portrait
- tapOn:
    id: "table.orientation.landscape"
- waitForAnimationToEnd
- assertVisible:
    text: "Leave table"
- takeScreenshot: slice-3.10-${PLAYER_COUNT}-seat-landscape
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- waitForAnimationToEnd
