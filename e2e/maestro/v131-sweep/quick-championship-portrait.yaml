appId: dev.isw.rivermindpoker
name: v1.3.1 sweep — Championship local_3 (tournament HUD)
---
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "onboarding.disclosuresContinue"
    commands:
      - waitForAnimationToEnd:
          timeout: 6000
      - tapOn:
          id: "onboarding.disclosuresContinue"
      - runFlow:
          when:
            notVisible:
              id: "onboarding.choice.later"
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                id: "onboarding.disclosuresContinue"
      - extendedWaitUntil:
          visible:
            id: "onboarding.choice.later"
          timeout: 8000
      - tapOn:
          id: "onboarding.choice.later"
      - waitForAnimationToEnd:
          timeout: 4000
- waitForAnimationToEnd:
    timeout: 8000
# Dev builds only: a LogBox warning toast parks over the tab bar and swallows
# taps; dismiss it through its close button before navigating.
- runFlow:
    when:
      visible: "Open debugger to view warnings"
    commands:
      - tapOn:
          point: "89%,91%"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "home.allGames"
    timeout: 30000
- tapOn:
    id: "home.allGames"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "play.championship.entry"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "play.championship.entry"
- scrollUntilVisible:
    element:
      id: "championship.event.local_3"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "championship.event.local_3"
- extendedWaitUntil:
    visible:
      id: "championship.play"
    timeout: 15000
- takeScreenshot: champ3-map
- tapOn:
    id: "championship.play"
# ---------- portrait action-row proof ----------
- runFlow:
    env:
      LABEL: champ3-portrait
    file: _action-check.yaml
- takeScreenshot: champ3-portrait-table
- stopApp
