appId: dev.isw.rivermindpoker
name: v1.3.1 sweep — Sit & Go ${SEATS} players (tournament HUD)
---
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "onboarding.disclosuresContinue"
    commands:
      - waitForAnimationToEnd:
          timeout: 6000
      - tapOn:
          id: "onboarding.disclosuresContinue"
      - runFlow:
          when:
            notVisible:
              id: "onboarding.choice.later"
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                id: "onboarding.disclosuresContinue"
      - extendedWaitUntil:
          visible:
            id: "onboarding.choice.later"
          timeout: 8000
      - tapOn:
          id: "onboarding.choice.later"
      - waitForAnimationToEnd:
          timeout: 4000
- waitForAnimationToEnd:
    timeout: 8000
# Dev builds only: a LogBox warning toast parks over the tab bar and swallows
# taps; dismiss it through its close button before navigating.
- runFlow:
    when:
      visible: "Open debugger to view warnings"
    commands:
      - tapOn:
          point: "89%,91%"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "home.allGames"
    timeout: 30000
- tapOn:
    id: "home.allGames"
- waitForAnimationToEnd:
    timeout: 5000
# A saved tournament run prompts Start new / Continue; the dialog mounts a
# beat after the hub, so guard twice before continuing.
- runFlow:
    when:
      visible: "Start new"
    commands:
      - tapOn: "Start new"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "Start new"
    commands:
      - tapOn: "Start new"
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      id: "play.ai.format.tournament"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "play.ai.format.tournament"
- scrollUntilVisible:
    element:
      id: "play.ai.players.${SEATS}"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "play.ai.players.${SEATS}"
- extendedWaitUntil:
    visible:
      id: "play.ai.start"
    timeout: 20000
- tapOn:
    id: "play.ai.start"
# ---------- landscape via the in-app orientation toggle ----------
- runFlow:
    when:
      visible:
        id: "table.continue.next_hand"
    commands:
      - tapOn:
          id: "table.continue.next_hand"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "table.orientation.landscape"
- extendedWaitUntil:
    visible:
      id: "table.orientation.landscape"
    timeout: 20000
- tapOn:
    id: "table.orientation.landscape"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: sitgo${SEATS}-landscape-table
- runFlow:
    env:
      LABEL: sitgo${SEATS}-landscape
      RAISE_X: "92"
    file: _landscape-probe.yaml
- stopApp
