appId: dev.isw.rivermindpoker
name: Slice 3.10 learning mission orientation smoke
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "tab.learn"
- scrollUntilVisible:
    element:
      id: "learn.chapter.preflop"
    direction: DOWN
- tapOn:
    id: "learn.chapter.preflop"
- scrollUntilVisible:
    element:
      id: "learn.mission.mission-preflop-enter-pot"
    direction: DOWN
- tapOn:
    id: "learn.mission.mission-preflop-enter-pot"
- assertVisible:
    id: "table.orientation.portrait"
- assertVisible:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-mission-portrait
- tapOn:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-mission-landscape
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- waitForAnimationToEnd
