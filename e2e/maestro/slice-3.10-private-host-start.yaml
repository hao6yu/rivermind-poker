appId: dev.isw.rivermindpoker
name: Slice 3.10 private two-client host start
---
- launchApp:
    clearState: false
- tapOn:
    id: "home.allGames"
- scrollUntilVisible:
    element:
      id: "play.multiplayer.resume"
    direction: DOWN
- tapOn:
    id: "play.multiplayer.resume"
- extendedWaitUntil:
    id: "multiplayer.lobby.primary"
    timeout: 20000
- tapOn:
    id: "multiplayer.lobby.primary"
- extendedWaitUntil:
    id: "multiplayer.lobby.primary"
    timeout: 20000
- tapOn:
    id: "multiplayer.lobby.primary"
- extendedWaitUntil:
    id: "table.orientation.portrait"
    timeout: 20000
- assertVisible:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-private-host-live
