appId: dev.isw.rivermindpoker
name: Slice 3.10 private two-client host lobby
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "home.allGames"
- scrollUntilVisible:
    element:
      id: "play.multiplayer.create"
    direction: DOWN
- tapOn:
    id: "play.multiplayer.create"
- tapOn:
    id: "multiplayer.create.seats.2"
- tapOn:
    id: "multiplayer.create.continue"
- extendedWaitUntil:
    id: "multiplayer.lobby.primary"
    timeout: 20000
- takeScreenshot: slice-3.10-private-host-lobby
