appId: dev.isw.rivermindpoker
name: Release 1.3 layout capture
---
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "tab.play"
    timeout: 30000
- tapOn:
    id: "tab.play"
- extendedWaitUntil:
    visible:
      id: "play.championship.entry"
    timeout: 15000
- tapOn:
    id: "play.ai.players.${SEATS}"
- tapOn:
    id: "play.ai.format.practice"
- scrollUntilVisible:
    element:
      id: "play.ai.start"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "play.ai.start"
- extendedWaitUntil:
    visible:
      id: "table.action.fold"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${LABEL}-portrait
- tapOn:
    id: "table.orientation.landscape"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${LABEL}-landscape
- tapOn:
    id: "table.orientation.portrait"
- tapOn:
    id: "table.leave"
- extendedWaitUntil:
    visible: "Leave table"
    timeout: 8000
- tapOn: "Leave table"
