appId: dev.isw.rivermindpoker
name: Slice 3.10 Sit and Go orientation smoke
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "home.allGames"
- scrollUntilVisible:
    element:
      id: "play.ai.start"
    direction: DOWN
- tapOn:
    id: "play.ai.sitAndGo3"
- assertVisible:
    id: "table.orientation.portrait"
- assertVisible:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-sit-and-go-portrait
- tapOn:
    id: "table.orientation.landscape"
- takeScreenshot: slice-3.10-sit-and-go-landscape
- stopApp
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- waitForAnimationToEnd
