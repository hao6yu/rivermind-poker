appId: dev.isw.rivermindpoker
name: Slice 3.10 private two-client guest join
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "home.allGames"
- scrollUntilVisible:
    element:
      id: "play.multiplayer.join"
    direction: DOWN
- tapOn:
    id: "play.multiplayer.join"
- tapOn:
    id: "multiplayer.join.code"
- inputText: "${ROOM_CODE}"
- tapOn:
    id: "multiplayer.join.continue"
- extendedWaitUntil:
    id: "multiplayer.lobby.primary"
    timeout: 20000
- tapOn:
    id: "multiplayer.lobby.primary"
- takeScreenshot: slice-3.10-private-guest-lobby
