name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # P18-007/S4: the localization gates are an explicit CI step so a
      # parity or Chinese-quality failure names its gate instead of hiding
      # inside the default suite log.
      - name: Localization gates (en, zh-Hans, zh-Hant)
        run: pnpm test:localization

  # P18-007/S4: the real-HTTP multiplayer lifecycle harness runs in its
  # dedicated job against a local Supabase stack. The harness fails — never
  # silently skips — when its prerequisites are missing, so a green job means
  # the legacy-lane HTTP 426 regression assertions actually executed.
  multiplayer-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack (applies migrations)
        run: supabase start

      - name: Multiplayer integration harness
        env:
          SUPABASE_BIN: /usr/local/bin/supabase
          DOCKER_BIN: /usr/bin/docker
        run: pnpm test:multiplayer-integration

  # P18-006/S4: the Play-facing Android artifact properties (target API 36,
  # 16 KB page alignment) are properties of the built binary, so CI builds an
  # actual APK and runs the inspection gate on that file. The signed release
  # candidate is additionally inspected by `pnpm release:check --
  # --android-artifact <file>` and on the owner's machine before submission.
  android-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild the native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Assemble the Android APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Inspect the built artifact (target API 36, 16 KB alignment)
        run: node scripts/verify-android-artifact.mjs android/app/build/outputs/apk/debug/app-debug.apk

  # S4: release configuration, secret hygiene, and the compiled friend-table
  # surface are proven against real Expo exports on every push.
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release configuration
        run: pnpm verify:release-config

      - name: Export iOS bundle
        run: pnpm exec expo export --platform ios --output-dir release-ios

      - name: Export Android bundle
        run: pnpm exec expo export --platform android --output-dir release-android

      - name: Scan tracked source and exports for secrets
        run: pnpm verify:mobile-secrets release-ios release-android

      # P18-004: the release artifact, not just source configuration, proves
      # friend tables and the v4 route are present.
      - name: Assert friend-table surface and v4 lane in the compiled bundle
        run: node scripts/verify-release-bundle.mjs release-android
